name: UI CI & Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Push UI Image
    runs-on: ubuntu-latest
    env:
      VERSION_PREFIX: ${{ vars.VERSION_PREFIX }}
      REGISTRY: registry.sutido.com
      DOCKER_REPO: ${{ vars.DOCKER_REPO }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Compute VERSION
        run: echo "VERSION=${VERSION_PREFIX}.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # The private registry, where the image goes. The Hub login above stays:
      # this Dockerfile starts FROM an official image, and those live on Hub no
      # matter where the result is pushed. Without it those pulls are anonymous,
      # and anonymous pulls are rate limited per IP on runners whose addresses
      # are shared with the rest of GitHub.
      - name: Log in to the private registry
        uses: docker/login-action@v2
        with:
          registry: registry.sutido.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & tag image
        run: |
          docker build \
            -t $REGISTRY/$DOCKER_REPO/$IMAGE_NAME:latest \
            -t $REGISTRY/$DOCKER_REPO/$IMAGE_NAME:$VERSION \
            -f Dockerfile .

      - name: Push both tags
        run: |
          docker push $REGISTRY/$DOCKER_REPO/$IMAGE_NAME:$VERSION
          docker push $REGISTRY/$DOCKER_REPO/$IMAGE_NAME:latest
